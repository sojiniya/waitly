# 로컬 개발용 인프라: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: waitly-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-waitly}
      POSTGRES_USER: ${DB_USERNAME:-waitly}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-waitly}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: waitly-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
